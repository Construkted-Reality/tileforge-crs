[package]
name = "tileforge-crs"
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["Construkted Reality"]
publish = false
description = "Error-agnostic CRS core (proj4rs → EPSG:4978 reprojection, WKT/sidecar EPSG parsing) shared by tileforge-pc and tileforge-mesh. See tileforge-pc ADR-004 and tileforge-mesh ADR-041."

[dependencies]
# CRS reprojection (tileforge-pc ADR-004). The `crs-definitions` feature
# pulls in the proj4-EPSG catalogue so `Proj::from_epsg_code(u16)` works.
# Version pinned to match tileforge-pc's workspace.
proj4rs = { version = "0.1.10", features = ["crs-definitions"] }
thiserror = "2"

# NOTE: the parity oracle compares Reprojector output to FROZEN PROJ
# ground-truth grids in tests/fixtures/*.parity-grid.txt (captured offline
# from PROJ 9.x). The live `proj` FFI is intentionally NOT a dependency —
# it requires system libproj/SQLite3, which build hosts (e.g. .211) lack,
# and no test invokes it at runtime. Regenerate fixtures on a PROJ-equipped
# machine if the reprojection ever changes. (tileforge-pc ADR-004.)
